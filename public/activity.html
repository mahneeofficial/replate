<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RePlate — Activity Log</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/notifications.css">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-top">
            <a href="/dashboard" class="brand-logo" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                <img src="/images/logo.png" alt="RePlate Logo" style="height: 32px; width: auto; object-fit: contain;">
                <span style="font-weight: 700; font-size: 1.2rem; color: #ffffff;">RePlate</span>
            </a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/dashboard"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a>
                </li>
                <li class="nav-item">
                    <a href="/donations"><i class="fa-solid fa-box-archive"></i> <span>Food Donations</span></a>
                </li>
                <li class="nav-item active">
                    <a href="/activity"><i class="fa-solid fa-clock-rotate-left"></i> <span>Activity Log</span></a>
                </li>
                <li class="nav-item">
                    <a href="/settings"><i class="fa-solid fa-sliders"></i> <span>Settings</span></a>
                </li>
            </ul>
        </div>

        <div class="user-profile">
            <div class="user-avatar" id="userAvatar"><i class="fa-solid fa-circle-user"></i></div>
            <div class="user-info">
                <h4 id="userNameDisplay">Loading...</h4>
                <p id="userRoleDisplay">MEMBER</p>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <h1 class="page-title">Recent Activity</h1>
            <p class="page-subtitle">Audit trail and history of claimed, delivered, or posted food items.</p>
        </header>
        
        <section class="content-card">
            <div class="card-header">
                <h3>Audit Trail & Claim History</h3>
            </div>
            <div id="activityLogContainer" class="activity-log-container">
                <div class="loading-state">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Fetching activity history...
                </div>
            </div>
        </section>
    </main>
</div>

<script src="/js/ui.js"></script>
<script>
// Tip: Consider moving this block into /js/ui.js so you don't have to duplicate it on every page
document.addEventListener('DOMContentLoaded', () => {
    try {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('userNameDisplay').textContent = user.full_name || user.username || user.name || 'User Profile';
            document.getElementById('userRoleDisplay').textContent = (user.user_type || user.role || 'MEMBER').toUpperCase();
        }
    } catch(e) {
        console.error('Failed to parse stored user profile:', e);
    }

    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = '/login';
        });
    }
});
</script>
<script src="/js/activity.js"></script>
</body>
</html>
